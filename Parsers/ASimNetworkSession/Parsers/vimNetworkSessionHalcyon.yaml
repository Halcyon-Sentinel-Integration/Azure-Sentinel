Parser:
  Title: Network Session ASIM filtering parser for Halcyon
  Version: '0.1.0'
  LastUpdated: Jun 15, 2026
Product:
  Name: Halcyon
Normalization:
  Schema: NetworkSession
  Version: '0.2.7'
References:
- Title: ASIM Network Session Schema
  Link: https://aka.ms/ASimNetworkSessionDoc
- Title: ASIM
  Link: https://aka.ms/AboutASIM
- Title: Halcyon Documentation
  Link: https://www.halcyon.ai
Description: |
  This ASIM parser supports filtering and normalizing Halcyon outbound network activity events to the
  ASIM NetworkSession normalized schema. These events are generated by Halcyon's data-exfiltration and
  network-peer-reputation detections and ingested into the HalcyonEventsV2_CL table in Microsoft Sentinel.

  Note: The HalcyonEventsV2_CL table must be configured on the Log Analytics workspace's Analytics plan to use this parser. The Basic Logs plan does not support invocation of user-defined functions, which is required for ASIM parser consumption.
Exceptions:
- Field: DstHostname
  Warning: Empty value in recommended field
  Exception: Halcyon Network Activity 4001 events emit only dst_endpoint.ip; no destination hostname is provided by the source.
- Field: DstDomain
  Warning: Empty value in recommended field
  Exception: Halcyon does not emit a destination FQDN; DstDomain cannot be derived.
- Field: SrcDomain
  Warning: Empty value in recommended field
  Exception: Halcyon does not emit a source FQDN; SrcDomain cannot be derived.
- Field: SrcIpAddr
  Warning: Empty value in recommended field
  Exception: Halcyon network events identify the source by hostname and device identifier; no source IP address is included in the source data.
- Field: DvcIpAddr
  Warning: Empty value in recommended field
  Exception: Halcyon Network Activity 4001 events do not emit a device IP; device endpoint information is limited to hostname and uid.
- Field: DstBytes
  Warning: Empty value in recommended field
  Exception: Halcyon emits traffic.bytes_out (source-side outbound volume) only; no destination-side byte counter is provided.
ParserName: vimNetworkSessionHalcyon
EquivalentBuiltInParser: _Im_NetworkSession_Halcyon
ParserParams:
  - Name: starttime
    Type: datetime
    Default: datetime(null)
  - Name: endtime
    Type: datetime
    Default: datetime(null)
  - Name: srcipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: dstipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: ipaddr_has_any_prefix
    Type: dynamic
    Default: dynamic([])
  - Name: dstportnumber
    Type: int
    Default: int(null)
  - Name: hostname_has_any
    Type: dynamic
    Default: dynamic([])
  - Name: dvcaction
    Type: dynamic
    Default: dynamic([])
  - Name: eventresult
    Type: string
    Default: '*'
  - Name: disabled
    Type: bool
    Default: false
ParserQuery: |
  let parser = (starttime:datetime=datetime(null), endtime:datetime=datetime(null), srcipaddr_has_any_prefix:dynamic=dynamic([]), dstipaddr_has_any_prefix:dynamic=dynamic([]), ipaddr_has_any_prefix:dynamic=dynamic([]), dstportnumber:int=int(null), hostname_has_any:dynamic=dynamic([]), dvcaction:dynamic=dynamic([]), eventresult:string='*', disabled:bool=false) {
      HalcyonEventsV2_CL
      | where not(disabled)
          and class_uid == 4001                                    // OCSF Network Activity (4001 only)
          and (isnull(starttime) or coalesce(HalcyonSourceTime, TimeGenerated) >= starttime)
          and (isnull(endtime)   or coalesce(HalcyonSourceTime, TimeGenerated) <= endtime)
      | extend
          EventResult = case(action_id == 2, "Failure", action_id == 1, "Success", "NA"),
          DvcAction   = case(action_id == 2, "Deny", action_id == 1, "Allow", "")   // NetworkSession enum has no "Block"; "Deny" = enforced block
      // Pushdown filters on raw OCSF fields.
      // NOTE: srcipaddr_has_any_prefix and dstportnumber are not applicable - Halcyon 4001 emits no source IP and no dst port.
      | where array_length(srcipaddr_has_any_prefix) == 0
          // ipv4_is_in_any_range used instead of has_any_ipv4_prefix because dst_endpoint.ip is a clean IP string,
          // not a log line haystack; has_any_ipv4_prefix with CIDR notation can return 0 against clean IP
          // columns, whereas ipv4_is_in_any_range matches reliably.
          and (array_length(dstipaddr_has_any_prefix) == 0 or ipv4_is_in_any_range(tostring(dst_endpoint.ip), dstipaddr_has_any_prefix))
          and (array_length(ipaddr_has_any_prefix) == 0 or ipv4_is_in_any_range(tostring(dst_endpoint.ip), ipaddr_has_any_prefix))
          and isnull(dstportnumber)
          and (array_length(hostname_has_any) == 0 or tostring(src_endpoint.hostname) has_any (hostname_has_any))
          and (array_length(dvcaction) == 0 or DvcAction in~ (dvcaction))
          and (eventresult == '*' or EventResult =~ eventresult)
      | extend
          SrcHostname_raw = tostring(src_endpoint.hostname),       // OCSF maps asset -> src_endpoint (no separate device object for 4001)
          DvcId           = tostring(src_endpoint.uid),
          DstIpAddr       = tostring(dst_endpoint.ip),             // populated only for peer-reputation events; empty for outbound-volume events
          SrcIpAddr       = tostring(src_endpoint.ip),             // not emitted by Halcyon 4001 today; future-proofed (empty for now)
          _bytes_out      = tolong(traffic.bytes_out),             // populated only for outbound-volume events
          _dur_secs       = toreal(traffic['timespan'].duration_secs),// populated only for outbound-volume events ('timespan' bracketed - reserved KQL keyword)
          SrcProcessId    = tostring(actor.process.pid),           // actor.process = connection initiator (the source process)
          SrcProcessName  = tostring(actor.process.file.path),
          SrcUsername     = tostring(actor.['user'].name),
          SrcUserId       = tostring(actor.['user'].uid),
          EventOriginalSeverity = tostring(severity)
      | invoke _ASIM_ResolveDvcFQDN('SrcHostname_raw')
      | extend
          NetworkBytes = _bytes_out,
          SrcBytes     = _bytes_out,                               // bytes_out is source-originated (outbound) volume
          NetworkDuration = iff(isnull(_dur_secs), int(null), toint(_dur_secs * 1000)),   // seconds -> milliseconds
          EventStartTime = coalesce(HalcyonSourceTime, TimeGenerated)
      | extend
          Duration     = NetworkDuration,
          EventEndTime = iff(isnull(_dur_secs), EventStartTime, EventStartTime + (_dur_secs * 1s)),
          Dst          = DstIpAddr,
          SrcHostname  = DvcHostname,
          Src          = coalesce(SrcIpAddr, DvcHostname),        // prefer IP if Halcyon emits it later; falls back to resolved hostname (== SrcHostname; referenced directly as SrcHostname is assigned in this same extend)
          IpAddr       = SrcIpAddr,                               // required ASIM alias of SrcIpAddr
          Hostname     = DvcHostname,
          SrcDvcId     = DvcId,
          SrcDvcIdType = iff(isnotempty(DvcId), "Other", ""),
          DvcIdType    = iff(isnotempty(DvcId), "Other", ""),
          Dvc          = coalesce(DvcId, DvcHostname),
          // Both event types in this class are outbound by definition (egress volume and peer-reputation egress).
          NetworkDirection = "Outbound",
          EventResultDetails = "NA",                              // NetworkSession enum has no "Other"; "NA" = no network-level result reason (verdict is in EventResult/DvcAction)
          EventSeverity = case(
                              EventOriginalSeverity in~ ("Informational", "Info"), "Informational",
                              EventOriginalSeverity =~ "Low", "Low",
                              EventOriginalSeverity =~ "Medium", "Medium",
                              EventOriginalSeverity in~ ("High", "Critical", "Fatal"), "High",
                              EventOriginalSeverity =~ "Unknown", "Informational",
                              "Informational"),
          Process          = SrcProcessName,
          User             = SrcUsername,
          SrcUsernameType  = _ASIM_GetUsernameType(tostring(actor.['user'].name)),
          SrcUserType      = _ASIM_GetUserType(tostring(actor.['user'].name), ""),
          SrcUserIdType    = case(isempty(tostring(actor.['user'].uid)), "", tostring(actor.['user'].uid) startswith "S-1-", "SID", "Other")
      | extend
          EventCount   = int(1),
          EventUid     = HalcyonEventId,
          EventOriginalUid = HalcyonEventId,
          EventMessage = tostring(message),
          EventOriginalType = tostring(type_name),
          EventOriginalSubType = tostring(activity_name),
          EventProduct = "Halcyon",
          EventVendor  = "Halcyon",
          EventSchema  = "NetworkSession",
          EventSchemaVersion = "0.2.7",
          EventType    = "EndpointNetworkSession",
          ASimMatchingHostname = case(
                                     array_length(hostname_has_any) == 0, "No match",
                                     tostring(src_endpoint.hostname) has_any (hostname_has_any), "SrcHostname",
                                     "No match"),
          ASimMatchingIpAddr = case(
                                   array_length(ipaddr_has_any_prefix) == 0, "No match",
                                   ipv4_is_in_any_range(tostring(dst_endpoint.ip), ipaddr_has_any_prefix), "DstIpAddr",
                                   "No match"),
          AdditionalFields = bag_pack(
                                "halcyon_alert_id",   tostring(unmapped.halcyon_alert_id),
                                "halcyon_tenant_id",  tostring(unmapped.halcyon_tenant_id),
                                "halcyon_event_kind", tostring(unmapped.halcyon_event_kind),
                                "halcyon_threshold",  tostring(unmapped.halcyon_threshold),
                                "halcyon_dxp_rule",   tostring(unmapped.halcyon_dxp_rule)
                            )
      | project-away SrcHostname_raw, _bytes_out, _dur_secs
  };
  parser(starttime=starttime, endtime=endtime, srcipaddr_has_any_prefix=srcipaddr_has_any_prefix, dstipaddr_has_any_prefix=dstipaddr_has_any_prefix, ipaddr_has_any_prefix=ipaddr_has_any_prefix, dstportnumber=dstportnumber, hostname_has_any=hostname_has_any, dvcaction=dvcaction, eventresult=eventresult, disabled=disabled)
